<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard – EduPortal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body data-page="student-dashboard">
  <header>
    <h1>EduPortal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="#" onclick="logout(); window.location.href='index.html'">Logout</a>
    </nav>
  </header>
  <main>
    <h2>Welcome, <span id="studentName"></span>!</h2>
    <div class="dashboard-grid">
      <div class="card">
        <h3>Your Courses</h3>
        <div id="studentCourses"></div>
      </div>
      <div class="card">
        <h3>Available Courses</h3>
        <div id="availableCourses"></div>
      </div>
      <div class="card">
        <h3>Upcoming Classes</h3>
        <ul id="upcomingClasses" class="leaderboard"></ul>
      </div>
      <div class="card">
        <h3>Progress Chart</h3>
        <div id="progressChart" class="chart-container"></div>
      </div>
      <div class="card">
        <h3>Badges</h3>
        <div id="badgeList" class="badge-list"></div>
      </div>
      <div class="card">
        <h3>Leaderboard</h3>
        <ul id="leaderboard" class="leaderboard"></ul>
      </div>
    </div>
    <div class="card">
      <h3>Class Chat</h3>
      <div id="chatBox" class="chat-box"></div>
      <div class="chat-input">
        <input type="text" id="chatInput" placeholder="Type a message..." />
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
