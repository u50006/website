<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quiz – EduPortal</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>Quiz</h1>
    <nav>
      <a id="backLink" href="#">Back to Course</a>
    </nav>
  </header>
  <main>
    <div class="card">
      <h2 id="quizTitle">Quiz</h2>
      <form id="quizForm">
        <div id="quizQuestions"></div>
        <button type="submit" class="button" style="margin-top:20px">Submit</button>
      </form>
      <div id="quizResult" style="margin-top:20px; font-weight:bold"></div>
    </div>
  </main>
  <script src="script.js"></script>
  <script>
    function getQueryParam(name) {
      const params = new URLSearchParams(window.location.search);
      return params.get(name);
    }
    let courseId;
    let quizId;
    let quiz;
    function loadQuiz() {
      courseId = parseInt(getQueryParam('courseId'));
      quizId = parseInt(getQueryParam('quizId'));
      const data = getData();
      const course = data.courses.find(c => c.id === courseId);
      if (!course) return;
      quiz = course.quizzes.find(q => q.id === quizId);
      if (!quiz) return;
      document.getElementById('quizTitle').textContent = quiz.title;
      document.getElementById('backLink').href = `course.html?courseId=${courseId}`;
      const container = document.getElementById('quizQuestions');
      container.innerHTML = '';
      quiz.questions.forEach((q, idx) => {
        const wrapper = document.createElement('div');
        wrapper.className = 'card';
        const html = [`<p><strong>Question ${idx + 1}:</strong> ${q.text}</p>`];
        q.options.forEach((opt, optIdx) => {
          html.push(`<label style="display:block; margin-left:20px;"><input type="radio" name="q${idx}" value="${optIdx}" required> ${opt}</label>`);
        });
        wrapper.innerHTML = html.join('');
        container.appendChild(wrapper);
      });
    }
    document.addEventListener('DOMContentLoaded', () => {
      loadQuiz();
      const form = document.getElementById('quizForm');
      form.addEventListener('submit', (e) => {
        e.preventDefault();
        // compute score
        let correctCount = 0;
        quiz.questions.forEach((q, idx) => {
          const selected = document.querySelector(`input[name="q${idx}"]:checked`);
          if (selected && parseInt(selected.value) === q.answer) {
            correctCount++;
          }
        });
        const score = Math.round((correctCount / quiz.questions.length) * 100);
        // record result
        const currentUser = JSON.parse(localStorage.getItem('currentUser'));
        recordQuizResult(currentUser.id, courseId, quizId, score);
        document.getElementById('quizResult').textContent = `You scored ${score}% (${correctCount} out of ${quiz.questions.length})`;
        // disable form to prevent resubmission
        form.querySelectorAll('input').forEach(input => input.disabled = true);
        form.querySelector('button').disabled = true;
      });
    });
  </script>
</body>
</html>
