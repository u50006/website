<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Teacher Dashboard – EduPortal</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
</head>
<body data-page="teacher-dashboard">
  <header>
    <h1>EduPortal</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="#" onclick="logout(); window.location.href='index.html'">Logout</a>
    </nav>
  </header>
  <main>
    <h2>Welcome, <span id="teacherName"></span>!</h2>
    <div class="dashboard-grid">
      <div class="card">
        <h3>Your Classes</h3>
        <div id="teacherClasses"></div>
      </div>
      <div class="card">
        <h3>Analytics</h3>
        <div id="teacherChart" class="chart-container"></div>
      </div>
    </div>
    <div class="card">
      <h3>Create Assignment</h3>
      <form onsubmit="createAssignment(event)">
        <div class="form-group">
          <label for="assignmentTitle">Assignment Title</label>
          <input type="text" id="assignmentTitle" required />
        </div>
        <div class="form-group">
          <label for="assignmentCourse">Course</label>
          <select id="assignmentCourse"></select>
        </div>
        <div class="form-group">
          <label for="assignmentDue">Due Date</label>
          <input type="date" id="assignmentDue" required />
        </div>
        <button type="submit" class="button">Create</button>
      </form>
    </div>

    <div class="card">
      <h3>Schedule Class</h3>
      <form id="scheduleForm">
        <div class="form-group">
          <label for="scheduleCourse">Course</label>
          <select id="scheduleCourse"></select>
        </div>
        <div class="form-group">
          <label for="scheduleDate">Date & Time (YYYY-MM-DDTHH:MM)</label>
          <!-- Use a text input instead of datetime-local to allow manual entry in this demo. -->
          <input type="text" id="scheduleDate" placeholder="2025-11-30T10:00" required />
        </div>
        <div class="form-group">
          <label for="scheduleTopic">Topic</label>
          <input type="text" id="scheduleTopic" required />
        </div>
        <button type="submit" class="button">Schedule</button>
      </form>
      <h4 style="margin-top:20px">Your Upcoming Classes</h4>
      <ul id="teacherUpcoming" class="leaderboard"></ul>
    </div>
  </main>
  <script>
    function createAssignment(e) {
      e.preventDefault();
      // gather form values
      const title = document.getElementById('assignmentTitle').value;
      const courseId = parseInt(document.getElementById('assignmentCourse').value);
      const dueDate = document.getElementById('assignmentDue').value;
      const data = getData();
      const course = data.courses.find(c => c.id === courseId);
      course.assignments.push({ title, due: dueDate });
      saveData(data);
      // notify all students enrolled in this course about the new assignment
      const enrolled = data.users.filter(u => u.courses && u.courses.includes(course.id)).map(u => u.id);
      addNotification(enrolled, `New assignment "${title}" due on ${dueDate} for ${course.title}`);
      alert('Assignment created');
      // reset form
      document.getElementById('assignmentTitle').value = '';
      document.getElementById('assignmentDue').value = '';
    }
    // Populate course options for teacher
    window.addEventListener('DOMContentLoaded', () => {
      const currentUser = JSON.parse(localStorage.getItem('currentUser'));
      const data = getData();
      // Populate both assignment and schedule selects
      const assignmentSelect = document.getElementById('assignmentCourse');
      const scheduleSelect = document.getElementById('scheduleCourse');
      const teacherCourses = data.courses.filter(c => c.teacher === currentUser.id);
      teacherCourses.forEach(course => {
        const opt1 = document.createElement('option');
        opt1.value = course.id;
        opt1.textContent = course.title;
        assignmentSelect.appendChild(opt1);
        const opt2 = document.createElement('option');
        opt2.value = course.id;
        opt2.textContent = course.title;
        scheduleSelect.appendChild(opt2);
      });
      // Handle scheduling form submission
      const scheduleForm = document.getElementById('scheduleForm');
      scheduleForm.addEventListener('submit', (e) => {
        e.preventDefault();
        const cId = parseInt(document.getElementById('scheduleCourse').value);
        const datetime = document.getElementById('scheduleDate').value;
        const topic = document.getElementById('scheduleTopic').value;
        if (!datetime || !topic) return;
        scheduleClass(cId, datetime, topic, currentUser.id);
        // notify students enrolled in this course about the scheduled class
        const freshData = getData();
        const enrolled2 = freshData.users.filter(u => u.courses && u.courses.includes(cId)).map(u => u.id);
        const courseName = freshData.courses.find(c => c.id === cId)?.title || '';
        addNotification(enrolled2, `Class scheduled: ${topic} on ${datetime} for ${courseName}`);
        alert('Class scheduled');
        scheduleForm.reset();
        loadTeacherUpcoming();
      });
      // Load teacher upcoming classes list
      function loadTeacherUpcoming() {
        const upcoming = getUpcomingClassesForUser(currentUser);
        const list = document.getElementById('teacherUpcoming');
        list.innerHTML = '';
        if (upcoming.length === 0) {
          const li = document.createElement('li');
          li.textContent = 'No scheduled classes';
          list.appendChild(li);
        } else {
          upcoming.forEach(cls => {
            const courseName = data.courses.find(c => c.id === cls.courseId)?.title || '';
            const dateStr = new Date(cls.datetime).toLocaleString();
            const li = document.createElement('li');
            li.textContent = `${courseName} – ${cls.topic} on ${dateStr}`;
            list.appendChild(li);
          });
        }
      }
      loadTeacherUpcoming();
    });
  </script>
  <script src="script.js"></script>
</body>
</html>
